
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050914">
<title>HOANG HAI VNTD PANEL</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#050914;color:#eafaff;
 font-family:Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
}
.panel{
 width: min(360px,92vw);
 background:linear-gradient(145deg,#101c2c,#080b18);
 border:1px solid #20dfff;border-radius:18px;
 box-shadow:0 0 25px #00cfff55;
 overflow:hidden;
}
.header{
 padding:18px;background:#0b2436;
 border-bottom:1px solid #20dfff;
 display:flex;justify-content:space-between;align-items:center;
}
.brand{font-size:17px;font-weight:900;color:#5cecff}
.version{font-size:10px;color:#9abacb;margin-top:5px}
.close{
 border:0;background:transparent;color:#fff;font-size:24px;
}
.content{padding:18px}
.section{
 color:#55eaff;font-size:12px;font-weight:bold;
 letter-spacing:1.5px;margin:4px 0 14px;
}
.item{
 display:flex;justify-content:space-between;align-items:center;
 padding:13px 12px;margin:10px 0;
 background:#101d2d;border:1px solid #203b50;
 border-radius:11px;
}
.item span{font-size:14px;font-weight:bold}
input[type=checkbox]{
 width:21px;height:21px;accent-color:#20dfff;
}
.fovline{display:flex;justify-content:space-between;align-items:center}
#fovValue{color:#55eaff;font-size:22px;font-weight:bold}
input[type=range]{width:100%;accent-color:#20dfff;margin:18px 0}
.btns{display:flex;gap:10px;margin-top:17px}
button.action{
 flex:1;padding:12px;border-radius:10px;
 border:1px solid #25dfff;background:#092d42;
 color:#65edff;font-weight:bold;
}
.status{text-align:center;font-size:11px;color:#8bb4c8;margin-top:15px}
.launcher{
 position:fixed;bottom:22px;right:18px;
 width:62px;height:62px;border-radius:50%;
 background:#071d2b;color:#5cecff;
 border:2px solid #36eaff;
 box-shadow:0 0 20px #00dfff;
 font-weight:900;
}
.hidden{display:none}
</style>
</head>
<body>

<div class="panel" id="panel">
 <div class="header" id="drag">
  <div>
   <div class="brand">HOÀNG HẢI VNTD</div>
   <div class="version">FF PANEL · DEMO VERSION 2.0</div>
  </div>
  <button class="close" id="close">×</button>
 </div>

 <div class="content">
  <div class="section">CONTROL CENTER</div>

  <div class="item">
   <span>SYSTEM STATUS</span>
   <input type="checkbox" id="system" checked>
  </div>

  <div class="section">FEATURES · SIMULATION</div>

  <div class="item">
   <span>AIMBOT DEMO</span>
   <input type="checkbox" id="aim">
  </div>

  <div class="item">
   <span>ESP DEMO</span>
   <input type="checkbox" id="esp">
  </div>

  <div class="item">
   <span>NEON EFFECT</span>
   <input type="checkbox" id="neon" checked>
  </div>

  <div class="item">
   <div class="fovline" style="width:100%">
    <span>FOV DEMO</span>
    <strong id="fovValue">90</strong>
   </div>
  </div>

  <input type="range" id="fov" min="60" max="120" value="90">

  <div class="btns">
   <button class="action" id="reset">RESET</button>
   <button class="action" id="minimize">MINIMIZE</button>
  </div>

  <div class="status" id="status">
   ● PANEL READY
  </div>
  <div class="status">
   Giao diện mô phỏng · Không can thiệp trò chơi
  </div>
 </div>
</div>

<button class="launcher hidden" id="launcher">VNTD</button>

<script>
(function(){
"use strict";

var panel=document.getElementById("panel");
var launcher=document.getElementById("launcher");
var fov=document.getElementById("fov");
var fovValue=document.getElementById("fovValue");
var system=document.getElementById("system");
var neon=document.getElementById("neon");
var status=document.getElementById("status");

function hidePanel(){
 panel.classList.add("hidden");
 launcher.classList.remove("hidden");
}
function showPanel(){
 panel.classList.remove("hidden");
 launcher.classList.add("hidden");
}

document.getElementById("close").onclick=hidePanel;
document.getElementById("minimize").onclick=hidePanel;
launcher.onclick=showPanel;

fov.oninput=function(){
 fovValue.textContent=this.value;
};

system.onchange=function(){
 status.textContent=this.checked?
 "● PANEL READY":"● PANEL DISABLED";
};

neon.onchange=function(){
 panel.style.boxShadow=this.checked?
 "0 0 25px #00cfff55":"none";
};

document.getElementById("reset").onclick=function(){
 document.getElementById("aim").checked=false;
 document.getElementById("esp").checked=false;
 system.checked=true;
 neon.checked=true;
 fov.value=90;
 fovValue.textContent="90";
 panel.style.boxShadow="0 0 25px #00cfff55";
 status.textContent="● PANEL RESET";
};

// Kéo thả bằng cảm ứng
var header=document.getElementById("drag");
var dragging=false,x=0,y=0;

header.addEventListener("touchstart",function(e){
 var t=e.touches[0];
 var r=panel.getBoundingClientRect();
 dragging=true;
 x=t.clientX-r.left;
 y=t.clientY-r.top;
},{passive:true});

document.addEventListener("touchmove",function(e){
 if(!dragging)return;
 var t=e.touches[0];
 panel.style.position="fixed";
 panel.style.left=Math.max(0,Math.min(
 window.innerWidth-panel.offsetWidth,t.clientX-x
 ))+"px";
 panel.style.top=Math.max(0,Math.min(
 window.innerHeight-panel.offsetHeight,t.clientY-y
 ))+"px";
 panel.style.margin="0";
},{passive:true});

document.addEventListener("touchend",function(){
 dragging=false;
});
})();
</script>

</body>
</html>
